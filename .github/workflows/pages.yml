name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5.1, and no Node line is
      # guaranteed to ship it. Without it npm publishes unauthenticated and the
      # registry answers 404 on an existing package, which reads as "no such
      # package" and is really "not your package".
      - run: npm install -g npm@latest
      - run: npm --version
      # Every push to main runs this job, but a version is published once. Ask
      # the registry first, or a site-only deploy fails the run on a version
      # conflict and the red X stops meaning anything.
      - id: published
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "fertig@$V" version >/dev/null 2>&1; then
            echo "fertig@$V is already on the registry — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip == 'false'
        run: npm publish
