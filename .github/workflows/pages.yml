name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer site edit must never interrupt an npm publish in flight.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  metadata:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const repository = await github.rest.repos.get(context.repo);
            if (repository.data.description !== manifest.description) {
              core.setFailed(
                `Repository description is out of sync. Expected: ${manifest.description}`,
              );
            }

  deploy:
    needs: [build, metadata]
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: [build, metadata]
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Pin the packer as well as the publisher: integrity comparisons are only
      # useful when retries produce the same tarball.
      - run: npm install -g npm@12.0.2
      - run: npm --version
      - id: package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json \
            | node tools/parse-pack-result.js \
            >> "$GITHUB_OUTPUT"
      - id: published
        shell: bash
        env:
          LOCAL_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          ERROR_FILE=$(mktemp)
          if REMOTE_INTEGRITY=$(npm view "fertig@$V" dist.integrity 2>"$ERROR_FILE"); then
            if [ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
              echo "fertig@$V already exists with different bytes" >&2
              exit 1
            fi
            echo "fertig@$V already exists with identical bytes — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" "$ERROR_FILE"; then
            echo "fertig@$V is not published yet"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi
      - if: steps.published.outputs.skip == 'false'
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --ignore-scripts
      - if: steps.published.outputs.skip == 'false'
        shell: bash
        env:
          LOCAL_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          # The publish above succeeded; this only waits for the registry to serve it
          # back. Ten tries three seconds apart is 30s, and npm has twice taken longer
          # than that -- 4.0.8 and 4.0.9 both failed here after publishing correctly.
          # Three minutes, quick at first for the ordinary case.
          for attempt in {1..15}; do
            REMOTE_INTEGRITY=$(npm view "fertig@$V" dist.integrity 2>/dev/null || true)
            if [ "$REMOTE_INTEGRITY" = "$LOCAL_INTEGRITY" ]; then
              echo "Verified fertig@$V on npm after ${attempt} attempt(s)"
              exit 0
            fi
            if [ -n "$REMOTE_INTEGRITY" ]; then
              echo "fertig@$V is on npm but the integrity differs" >&2
              echo "  local:  $LOCAL_INTEGRITY" >&2
              echo "  remote: $REMOTE_INTEGRITY" >&2
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; else sleep 15; fi
          done
          echo "npm did not serve fertig@$V back within three minutes." >&2
          echo "The publish step itself succeeded; check the registry before republishing." >&2
          exit 1
