<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="fertig">
  <!--
    [f — an attribute selector holding the initial.

    Not a checkmark: every to-do app owns that shape, and at 16px a tick in a
    box reads as a checkbox rather than a stylesheet. The square bracket is
    this library's own idiom — its component layer is addressed by attribute
    selectors (role=switch, popover, data-tone), not by class names — so the
    mark says what the sheet actually is.

    Drawn with the bracket pulled clear of the f's stem. At 16px a brace that
    touches the stem closes up into a blob; the clearance is the whole reason
    this reads at favicon size. Stroke weight is deliberately heavy for the
    same reason — thinning is what kills a mark when it is small.

    Colours are the sheet's own tokens, written in oklch because that is what
    the stylesheet uses; a favicon gets no legacy either. currentColor is
    meaningless in a file loaded as an image, so both tones are explicit and
    swap on prefers-color-scheme.
  -->
  <style>
    :root { --ink: oklch(22% .008 75); --ac: oklch(48% .095 250) }
    @media (prefers-color-scheme: dark) {
      :root { --ink: oklch(95% .004 75); --ac: oklch(78% .085 245) }
    }
  </style>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the selector -->
    <path d="M19 18H13V46h6" stroke="var(--ink)" stroke-width="5.5"/>
    <!-- fertig -->
    <g stroke="var(--ac)" stroke-width="7.5">
      <path d="M49 20c0-5-3.5-8-7.5-8S35 15 35 20v32"/>
      <path d="M29 31h16"/>
    </g>
  </g>
</svg>
