<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A window with its title bar, and a check in the paper: the two things the
    sheet is about — furniture you did not have to build, and a page that is
    already finished. Colours are the sheet's own tokens, written in oklch
    because that is what the stylesheet uses; a favicon gets no legacy either.

    Proportions are tuned for 16px, where a favicon actually lives: a heavy
    check, a title bar thin enough to read as a bar rather than a lid, and no
    outline — at that size an outline is one detail too many, and the title
    bar already tells you where the window edge is.
  -->
  <style>
    :root {
      --ac: oklch(48% .095 250);
      --paper: oklch(99.4% .002 75);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ac: oklch(78% .085 245);
        --paper: oklch(21% .006 75);
      }
    }
  </style>

  <!-- the window: paper below, title bar above, one shape -->
  <rect x="2" y="4" width="28" height="24" rx="5" fill="var(--ac)"/>
  <path d="M2 11h28v12a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5Z" fill="var(--paper)"/>

  <!-- fertig: done -->
  <path d="M9.5 19.5 14 24l8.5-9"
        fill="none" stroke="var(--ac)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
