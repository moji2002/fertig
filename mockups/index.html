<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fertig — tone mockups</title>
<style>
  :root{color-scheme:light dark;
    --ink:light-dark(#1a1a1a,#f0efec);--paper:light-dark(#fbfaf8,#141414);
    --fertig-face:light-dark(#efedea,#1f1f1f);--fertig-bd:light-dark(#00000022,#ffffff22);
    --fertig-mut:light-dark(#6a6763,#a5a29d)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--paper);color:var(--ink);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    display:grid;grid-template-rows:auto 1fr}
  header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
    padding:.7rem 1rem;border-bottom:1px solid var(--fertig-bd);background:var(--fertig-face)}
  h1{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
    margin:0;color:var(--fertig-mut);font-weight:600}
  .tabs{display:flex;gap:.35rem;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:.8rem;cursor:pointer;
    padding:.4rem .8rem;border:1px solid var(--fertig-bd);border-radius:6px;
    background:var(--paper);color:var(--ink);white-space:nowrap}
  .tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid #3b76c9;outline-offset:2px}
  .meta{margin-inline-start:auto;color:var(--fertig-mut);font-size:.75rem;
    display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
  .meta a{color:inherit}
  iframe{border:0;width:100%;height:100%;background:var(--paper)}
</style>

<header>
  <h1>fertig · tone mockups</h1>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-src="a-technical.html">A · Technical / austere</button>
    <button role="tab" aria-selected="false" data-src="b-editorial.html">B · Editorial</button>
    <button role="tab" aria-selected="false" data-src="c-minimal.html">C · Modern minimal</button>
  </div>
  <p class="meta"><span id="note">IBM Plex Mono + Plex Sans · spec-table structure</span></p>
</header>

<iframe id="frame" src="a-technical.html" title="Mockup preview"></iframe>

<script>
  const notes = {
    'a-technical.html': 'IBM Plex Mono + Plex Sans · spec-table structure',
    'b-editorial.html': 'Instrument Serif + Inter · long-document structure',
    'c-minimal.html'  : 'Space Grotesk + Inter · stat-led structure',
  };
  const tabs = [...document.querySelectorAll('[role=tab]')];
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(o => o.setAttribute('aria-selected', String(o === t)));
    const src = t.dataset.src;
    document.getElementById('frame').src = src;
    document.getElementById('note').textContent = notes[src];
  }));
</script>
</html>
